<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Map the deck_helpers type pair to its installed metric-compatible substitute
  so LibreOffice renders (and therefore measures wrapping) faithfully:
    Georgia -> Gelasio   (Georgia-metric, OFL)
    Calibri -> Carlito   (Calibri-metric, fonts-crosextra-carlito)
  Calibri->Carlito is also built into LibreOffice's substitution table; the
  alias here keeps both deterministic regardless of LO version.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Gelasio</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
</fontconfig>
